# claude-share manifest — where every project lives and which machines get it.
# Edited by `cs add` (appends [projects.<name>] blocks) or by hand.
schema_version = 1

[workspace]
root = "~/dev"                # same relative layout on every machine
default_branch = "master"     # branch `cs new` creates

# ---- Git identities ---------------------------------------------------------
# An identity = a GitHub owner (user or org) + how you commit there. Everything else is derived:
#   ssh key  ~/.ssh/cs/<id>  (per machine; `cs ssh setup`)   url match  git@github.com:<owner>/**
# Add with `cs identity add <id> --owner <owner> --name ".." --email ..`.

# [identities.personal]           # `cs init` creates your first identity; add more with `cs identity add`
# owner = "your-github-login"
# name  = "Your Name"
# email = "you@example.com"

# [identities.acme]                # one per client/employer org
# owner = "acme-org"
# name  = "Your Name"
# email = "you@acme.com"
# url_globs = ["git@github.com:acme-org/**", "git@github.com:acme-old-name/**"]   # optional override (renamed org)

# ---- Projects ---------------------------------------------------------------
# kind:     git (clone from url) | synced (private auto-committed repo, no manual git) | local (never leaves one machine)
# profiles: which machine profiles want it (machine.toml `profiles`); "all" = every machine
# machines: optional hard allowlist of machine names
# layout:   plain | worktrees  (checkout lives in <name>/repo, siblings are git worktrees)

# [projects.example]
# kind = "git"
# url = "git@github.com:your-org/example.git"
# identity = "personal"
# profiles = ["all"]
# branch = "main"

# Handoff (cs handoff / cs resume) — optional per project:
# [projects.example.handoff]
# extra   = ["local.conf"]        # gitignored files that must travel with uncommitted work
# never   = ["*.sqlite"]          # extends the secret-file deny list
# exclude = ["vendor/"]           # never snapshot these
# (or `handoff = false` inside [projects.example] to opt out)
